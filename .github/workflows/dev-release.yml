name: Android DEV Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/dev-release.yml'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Optional custom release notes'
        required: false
        default: 'Automated DEV build'

permissions:
  contents: write

jobs:
  build-and-publish-dev:
    name: Build & Publish DEV APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Determine Deterministic DEV Version
        id: versioning
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_SHA_SHORT=$(git rev-parse --short HEAD)
          VERSION_CODE=$((1000 + COMMIT_COUNT))
          VERSION_NAME="1.1.${VERSION_CODE}-dev"
          BUILD_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          echo "COMMIT_COUNT=${COMMIT_COUNT}" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA_SHORT=${COMMIT_SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" >> $GITHUB_OUTPUT
          
          echo "Calculated DEV Version: ${VERSION_NAME} (code: ${VERSION_CODE}) for commit ${COMMIT_SHA_SHORT}"

      - name: Grant execute permission for gradlew
        run: |
          chmod +x android/gradlew

      - name: Validate DEV Signing Secrets
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
          DEV_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          DEV_KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
          DEV_KEY_PASSWORD: ${{ secrets.DEV_KEY_PASSWORD }}
        run: |
          MISSING_SECRETS=()
          [ -z "$DEV_KEYSTORE_BASE64" ] && MISSING_SECRETS+=("DEV_KEYSTORE_BASE64")
          [ -z "$DEV_KEYSTORE_PASSWORD" ] && MISSING_SECRETS+=("DEV_KEYSTORE_PASSWORD")
          [ -z "$DEV_KEY_ALIAS" ] && MISSING_SECRETS+=("DEV_KEY_ALIAS")
          [ -z "$DEV_KEY_PASSWORD" ] && MISSING_SECRETS+=("DEV_KEY_PASSWORD")
          
          if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
            echo "::error::CRITICAL: Cannot publish DEV release without stable DEV signing credentials!"
            echo "::error::Missing required GitHub Actions secret(s): ${MISSING_SECRETS[*]}"
            echo "::error::Published DEV releases require the same stable signing identity across all releases to allow seamless in-place updates."
            echo "::error::Please configure the following repository secrets: DEV_KEYSTORE_BASE64, DEV_KEYSTORE_PASSWORD, DEV_KEY_ALIAS, DEV_KEY_PASSWORD."
            exit 1
          fi
          echo "DEV signing secrets validated successfully."

      - name: Decode DEV Keystore
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_DIR="${{ runner.temp }}/keystore"
          mkdir -p "${KEYSTORE_DIR}"
          echo "${DEV_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_DIR}/dev-release.jks"
          chmod 600 "${KEYSTORE_DIR}/dev-release.jks"
          if [ ! -s "${KEYSTORE_DIR}/dev-release.jks" ]; then
            echo "::error::Failed to decode DEV keystore from DEV_KEYSTORE_BASE64 secret (file is empty or invalid base64)."
            exit 1
          fi
          echo "DEV keystore successfully decoded to runner temporary storage."

      - name: Build DEV APK
        env:
          DEV_VERSION_CODE: ${{ steps.versioning.outputs.VERSION_CODE }}
          DEV_VERSION_NAME: ${{ steps.versioning.outputs.VERSION_NAME }}
          DEV_KEYSTORE_PATH: ${{ runner.temp }}/keystore/dev-release.jks
          DEV_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          DEV_KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
          DEV_KEY_PASSWORD: ${{ secrets.DEV_KEY_PASSWORD }}
          DEV_SIGNING_REQUIRED: "true"
        run: |
          cd android
          ./gradlew assembleDevRelease --stacktrace

      - name: Package DEV APK artifact
        run: |
          mkdir -p dist
          APK_PATH=$(find android/app/build/outputs/apk/dev -name "*.apk" ! -name "*unaligned*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: DEV APK not found!"
            exit 1
          fi
          echo "Found APK at: ${APK_PATH}"
          cp "${APK_PATH}" dist/veylora-dev.apk
          
          APK_SHA256=$(sha256sum dist/veylora-dev.apk | cut -d' ' -f1)
          APK_SIZE=$(stat -c%s dist/veylora-dev.apk)
          
          echo "APK_SHA256=${APK_SHA256}" >> $GITHUB_ENV
          echo "APK_SIZE=${APK_SIZE}" >> $GITHUB_ENV
          echo "Dev APK packaged: size=${APK_SIZE} bytes, sha256=${APK_SHA256}"

      - name: Verify DEV APK Signature
        run: |
          echo "Verifying APK signing certificate..."
          apksigner verify --verbose dist/veylora-dev.apk
          apksigner verify --print-certs dist/veylora-dev.apk

      - name: Generate latest.json metadata contract
        env:
          VERSION_CODE: ${{ steps.versioning.outputs.VERSION_CODE }}
          VERSION_NAME: ${{ steps.versioning.outputs.VERSION_NAME }}
          COMMIT_SHA: ${{ steps.versioning.outputs.COMMIT_SHA }}
          COMMIT_SHA_SHORT: ${{ steps.versioning.outputs.COMMIT_SHA_SHORT }}
          BUILD_TIMESTAMP: ${{ steps.versioning.outputs.BUILD_TIMESTAMP }}
          CUSTOM_NOTES: ${{ inputs.release_notes }}
        run: |
          RELEASE_NOTES="${CUSTOM_NOTES:-Automated DEV build for commit ${COMMIT_SHA_SHORT}}"
          cat <<EOF > dist/latest.json
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "https://github.com/playboiammav/Veylora_codex/releases/download/v${VERSION_NAME}/veylora-dev.apk",
            "apkName": "veylora-dev.apk",
            "apkSize": ${APK_SIZE},
            "sha256": "${APK_SHA256}",
            "releaseNotes": "${RELEASE_NOTES}",
            "commitSha": "${COMMIT_SHA}",
            "publishedAt": "${BUILD_TIMESTAMP}"
          }
          EOF
          
          cp dist/latest.json android/latest.json
          echo "Generated latest.json:"
          cat dist/latest.json

      - name: Upload Build Artifacts to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: veylora-dev-apk-${{ steps.versioning.outputs.VERSION_NAME }}
          path: |
            dist/veylora-dev.apk
            dist/latest.json

      - name: Publish Versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versioning.outputs.VERSION_NAME }}
          name: Veylora DEV v${{ steps.versioning.outputs.VERSION_NAME }}
          body: |
            ### Veylora Development Build
            - **Version Name:** `${{ steps.versioning.outputs.VERSION_NAME }}`
            - **Version Code:** `${{ steps.versioning.outputs.VERSION_CODE }}`
            - **Commit:** `${{ steps.versioning.outputs.COMMIT_SHA }}`
            - **Built At:** `${{ steps.versioning.outputs.BUILD_TIMESTAMP }}`
            - **SHA-256:** `${{ env.APK_SHA256 }}`
            - **Size:** `${{ env.APK_SIZE }} bytes`
            
            ${{ inputs.release_notes || 'Automated DEV channel build.' }}
          draft: false
          prerelease: true
          files: |
            dist/veylora-dev.apk
            dist/latest.json

      - name: Update Rolling dev-latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Veylora DEV Channel (Latest)
          body: |
            Latest Veylora DEV channel release.
            - **Latest Version:** `${{ steps.versioning.outputs.VERSION_NAME }}` (`${{ steps.versioning.outputs.VERSION_CODE }}`)
            - **Commit:** `${{ steps.versioning.outputs.COMMIT_SHA }}`
            - **Updated:** `${{ steps.versioning.outputs.BUILD_TIMESTAMP }}`
          draft: false
          prerelease: true
          files: |
            dist/veylora-dev.apk
            dist/latest.json

      - name: Clean up temporary DEV keystore
        if: always()
        run: |
          rm -rf "${{ runner.temp }}/keystore"
          echo "DEV keystore material cleaned up from runner."
